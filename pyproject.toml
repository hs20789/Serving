[project]
name = "serving"
version = "0.1.0"
description = "PyTorch 모델을 FastAPI로 서빙하는 학습용 예제 프로젝트"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.4.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "torch>=2.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    # fastapi.testclient 가 내부적으로 사용
    "pytest>=8.0",
]

[tool.uv]
# 배포용 라이브러리가 아니라 애플리케이션이므로 빌드/설치하지 않는다.
package = false

# GPU 가 없는 환경이므로 CPU 전용 torch 휠을 쓴다.
# (기본 PyPI 의 torch 는 CUDA 런타임까지 함께 받아서 수 GB 가 된다.)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests 에서 `import app` 이 되도록 프로젝트 루트를 sys.path 에 추가
